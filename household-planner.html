<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Household planner</title>
<style>
:root{color-scheme:light;
  --bg:#f2f2f7;--card:#ffffff;--card2:#f2f2f7;--label:#000000;--label2:rgba(60,60,67,.66);--label3:rgba(60,60,67,.32);
  --sep:rgba(60,60,67,.16);--fill:rgba(120,120,128,.12);--fill2:rgba(120,120,128,.2);--thumb:#ffffff;--material:rgba(255,255,255,.9);
  --blue:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--indigo:#5856d6;
  --blue-t:#0062cc;--green-t:#1f7a36;--orange-t:#a85a00;--red-t:#d70015;
  --c1:var(--blue);--c2:var(--green);--c3:var(--orange);--c4:var(--indigo);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,"Segoe UI",Roboto,Arial,sans-serif;
}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#000000;--card:#1c1c1e;--card2:#2c2c2e;--label:#ffffff;--label2:rgba(235,235,245,.64);--label3:rgba(235,235,245,.32);
  --sep:rgba(84,84,88,.62);--fill:rgba(120,120,128,.24);--fill2:rgba(120,120,128,.36);--thumb:#636366;--material:rgba(28,28,30,.9);
  --blue:#0a84ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;--indigo:#5e5ce6;
  --blue-t:#66adff;--green-t:#4cd964;--orange-t:#ffb340;--red-t:#ff6961;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#000000;--card:#1c1c1e;--card2:#2c2c2e;--label:#ffffff;--label2:rgba(235,235,245,.64);--label3:rgba(235,235,245,.32);
  --sep:rgba(84,84,88,.62);--fill:rgba(120,120,128,.24);--fill2:rgba(120,120,128,.36);--thumb:#636366;--material:rgba(28,28,30,.9);
  --blue:#0a84ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;--indigo:#5e5ce6;
  --blue-t:#66adff;--green-t:#4cd964;--orange-t:#ffb340;--red-t:#ff6961;}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--label);font:15px/1.4 var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select{font-family:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 55%,transparent);outline-offset:2px;border-radius:8px}

/* shell */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
nav{position:sticky;top:0;align-self:start;height:100vh;padding:22px 14px 18px;display:flex;flex-direction:column;gap:2px;background:var(--material);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-right:.5px solid var(--sep)}
.brand{font-size:20px;font-weight:700;letter-spacing:.01em;padding:4px 10px 18px}
nav button{display:flex;align-items:center;gap:10px;font:inherit;font-weight:500;color:var(--label);background:none;border:0;border-radius:10px;padding:9px 10px;cursor:pointer;text-align:left;transition:background .15s}
nav button svg{color:var(--blue);flex:none}
nav button:hover{background:var(--fill)}
nav button[aria-current="page"]{background:var(--fill2);font-weight:600}
.nav-foot{margin-top:auto;padding:14px 4px 0;display:grid;gap:10px;font-size:12px;color:var(--label2)}
.lbl-short{display:none}
main{padding:28px clamp(16px,3.5vw,44px) 56px;max-width:1260px;width:100%;min-width:0}
.page-head{padding:6px 2px 18px}
h1{font-size:34px;line-height:1.12;font-weight:700;letter-spacing:.01em;margin:0}
.sub{color:var(--label2);margin:6px 0 0;max-width:62ch;font-size:15px}
.banner{background:color-mix(in srgb,var(--orange) 20%,var(--card));border-radius:14px;padding:12px 16px;margin-bottom:16px}

/* bento */
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.tile{background:var(--card);border-radius:24px;padding:20px 22px;min-width:0}
.tile h2{font-size:20px;line-height:1.2;font-weight:700;letter-spacing:.01em;margin:0}
.tile .sub{margin:4px 0 0;font-size:14px}
.s-3{grid-column:span 3}.s-4{grid-column:span 4}.s-5{grid-column:span 5}.s-6{grid-column:span 6}.s-7{grid-column:span 7}.s-8{grid-column:span 8}.s-12{grid-column:span 12}
@media (max-width:1100px){.s-4,.s-5,.s-6,.s-7,.s-8{grid-column:span 12}.s-3{grid-column:span 6}}
@media (max-width:560px){.tile{padding:16px;border-radius:20px}.bento{gap:12px}}
.hero h2{font-size:28px;line-height:1.15;max-width:22ch}
.split{display:flex;gap:3px;height:22px;margin:20px 0 16px}
.split i{display:block;height:100%;border-radius:6px;min-width:0}
.split i[style*="width:0%"]{display:none}
.split i:last-child{background:var(--fill)}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px 24px;margin:0;padding:0;list-style:none}
.legend li{display:grid;grid-template-columns:12px 1fr;gap:1px 10px;align-items:baseline}
.dot{width:12px;height:12px;border-radius:50%;display:block;transform:translateY(1px)}
.legend b{font-weight:600}
.legend small{grid-column:2;color:var(--label2);font-size:13px}
.ring-tile{display:flex;flex-direction:column}
.ring-wrap{position:relative;width:150px;height:150px;margin:12px auto 8px}
.ring-wrap svg{width:100%;height:100%}
.ring-bg{fill:none;stroke:var(--fill2);stroke-width:13}
.ring-fg{fill:none;stroke:var(--green);stroke-width:13;stroke-linecap:round}
.tint-red .ring-fg{stroke:var(--red)}
.tint-green{background:color-mix(in srgb,var(--green) 13%,var(--card))}
.tint-red{background:color-mix(in srgb,var(--red) 13%,var(--card))}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-c b{font-size:30px;font-weight:700;line-height:1.1}
.ring-c span{font-size:12px;color:var(--label2)}
.ring-cap{margin:auto 0 0;text-align:center;font-weight:600}
.kpi{display:flex;flex-direction:column;gap:4px;min-height:132px}
.k-label{font-size:13px;font-weight:600;color:var(--label2)}
.k-val{font-size:32px;font-weight:700;line-height:1.1;letter-spacing:.005em;margin-top:14px}
.k-val .calc,.k-cap .calc{display:inline;padding:0;color:inherit;background:none;font:inherit;margin:0}
.k-cap{font-size:13px;color:var(--label2);margin-top:auto}
.rows{margin-top:8px}
.row{padding:12px 0;border-top:.5px solid var(--sep)}
.row:first-child{border-top:0}
.row .top{display:flex;justify-content:space-between;gap:12px;align-items:center}
.row .name{font-weight:600}
.row .meta{font-size:13px;color:var(--label2);margin-top:2px}
.bar{height:8px;background:var(--fill);border-radius:4px;display:flex;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%}
.bar.thin{height:5px;margin-top:5px}
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{color:var(--green-t);background:color-mix(in srgb,var(--green) 16%,transparent)}
.pill.bad{color:var(--red-t);background:color-mix(in srgb,var(--red) 14%,transparent)}
.pill.warn{color:var(--orange-t);background:color-mix(in srgb,var(--orange) 18%,transparent)}
.ok{color:var(--green-t)}.bad{color:var(--red-t)}.warn{color:var(--orange-t)}
.empty{color:var(--label2);padding:12px 0 0}

/* plan */
.tracker{position:sticky;top:12px;z-index:10;margin:0 0 16px;padding:14px 20px 16px;border-radius:22px;background:var(--material);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border:.5px solid var(--sep)}
.t-row{display:flex;flex-wrap:wrap;gap:6px 36px;align-items:flex-end}
.t-row small{display:block;font-size:13px;color:var(--label2)}
.t-row b{font-size:22px;font-weight:700;line-height:1.3}
.t-row .t-left b{font-size:30px}
.t-warn{font-weight:600;font-size:14px}
.tracker .split{height:12px;margin:10px 0 0}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:8px 20px;flex-wrap:wrap}
.share{display:flex;align-items:center;gap:8px;color:var(--label2);font-size:14px}
.share input{color:var(--label);background:var(--fill);border:0;border-radius:8px;padding:6px 9px;width:64px;text-align:right;font:inherit}
.meter{display:grid;grid-template-columns:auto minmax(120px,1fr);gap:2px 22px;align-items:center;margin:16px 0 6px}
.m-left b{display:block;font-size:34px;font-weight:700;line-height:1.1;letter-spacing:.005em}
.m-left span{font-size:13px;color:var(--label2)}
.m-left.bad b,.m-left.bad span{color:var(--red-t)}
.m-bar{height:12px;background:var(--fill);border-radius:6px;overflow:hidden}
.m-bar i{display:block;height:100%;background:var(--sc,var(--c1));border-radius:6px}
.m-bar i.over{background:var(--red)}
.m-sub{grid-column:2;font-size:13px;color:var(--label2)}
.lrow{display:grid;grid-template-columns:12px 172px minmax(60px,1fr) 88px;gap:12px;align-items:center;padding:11px 0;border-top:.5px solid var(--sep)}
.lrow:first-of-type{border-top:0}
.lbar{height:8px;background:var(--fill);border-radius:4px;overflow:hidden}
.lbar i{display:block;height:100%;border-radius:4px}
.lrow b{text-align:right;font-weight:600}
.mini{display:inline-block;width:62px;height:6px;background:var(--fill);border-radius:3px;overflow:hidden;vertical-align:middle;margin-right:8px}
.mini i{display:block;height:100%;background:var(--green)}

/* tables */
.sheet{margin-top:12px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%}
th{font-size:12px;font-weight:600;color:var(--label2);text-align:left;padding:10px 8px 8px;border-bottom:.5px solid var(--sep);vertical-align:bottom}
td{padding:1px 2px;border-bottom:.5px solid var(--sep)}
tbody tr:last-child td{border-bottom:0}
tfoot td{border-top:.5px solid var(--sep);border-bottom:0;font-weight:600;padding:6px 8px}
th.num,td.num{text-align:right}
td input,td select{color:var(--label);background:transparent;border:0;border-radius:8px;padding:8px 8px;width:100%;min-width:84px;min-height:36px;font:inherit}
td input[type=text]{min-width:120px}
td input[type=date]{min-width:140px}
td input[type=number]{text-align:right;min-width:112px}
td input:hover,td select:hover{background:var(--fill)}
td input:focus,td select:focus{outline:0;background:var(--card2);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 40%,transparent)}
td input::placeholder{color:var(--label3)}
.calc{display:block;padding:8px;color:var(--label2);white-space:nowrap}
.calc.ok,.calc.bad,.calc.warn{display:inline-block;margin:6px 6px;padding:1px 9px;border-radius:999px;font-size:13px;font-weight:600}
.calc.ok{background:color-mix(in srgb,var(--green) 16%,transparent)}
.calc.bad{background:color-mix(in srgb,var(--red) 14%,transparent)}
.calc.warn{background:color-mix(in srgb,var(--orange) 18%,transparent)}
td.act{width:36px;text-align:center}
.x{font-size:18px;line-height:1;color:var(--label3);background:none;border:0;border-radius:8px;padding:6px 9px;cursor:pointer}
.x:hover{color:var(--red-t);background:var(--fill)}
.add{font-weight:600;color:var(--blue-t);background:none;border:0;border-radius:10px;padding:9px 8px;margin:6px 0 -6px -8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:15px}
.add::before{content:"+";font-size:21px;line-height:1;font-weight:500}
.add:hover{background:var(--fill)}

/* controls */
.btn{font-weight:600;color:#fff;background:var(--blue);border:0;border-radius:12px;padding:11px 18px;cursor:pointer;font-size:15px}
.btn.plain{background:var(--fill);color:var(--blue-t)}
.btn.danger{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red-t)}
.btn:active,.seg-b:active,nav button:active{transform:scale(.97)}
.btn:hover{filter:brightness(1.05)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 0}
.seg{display:inline-flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px;max-width:100%;overflow-x:auto}
.seg-b{font-size:14px;font-weight:500;color:var(--label);background:none;border:0;border-radius:8px;padding:6px 14px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;transition:background .15s}
.seg-b[aria-pressed="true"]{background:var(--thumb);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.16),0 0 0 .5px rgba(0,0,0,.04)}
.seg-b .n{font-size:12px;color:var(--label2);font-weight:500}
.toolbar{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;justify-content:space-between;margin:0 0 16px}
.fx{display:flex;flex-wrap:wrap;gap:10px 22px}
.fx label{display:flex;align-items:center;gap:10px;color:var(--label2);font-size:14px}
.fx input{color:var(--label);background:var(--card);border:0;border-radius:10px;padding:8px 10px;width:92px;text-align:right;font:inherit}

/* phone: iOS tab bar */
@media (max-width:820px){
  .app{display:flex;flex-direction:column}
  main{order:1;flex:1;padding-top:20px}
  nav{order:2;align-self:stretch;width:100%;position:sticky;bottom:0;top:auto;height:auto;flex-direction:row;justify-content:space-around;gap:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:.5px solid var(--sep);z-index:20}
  .brand,.nav-foot{display:none}
  nav button{flex:1;flex-direction:column;gap:2px;font-size:10px;padding:6px 0;border-radius:8px;color:var(--label2);min-width:0;justify-content:center;align-items:center}
  nav button svg{color:inherit}
  nav button[aria-current="page"]{background:none;color:var(--blue-t);font-weight:600}
  .lbl-long{display:none}.lbl-short{display:inline}
  h1{font-size:30px}
  .tracker{top:8px}
  .meter{grid-template-columns:1fr}.m-sub{grid-column:1}
  .lrow{grid-template-columns:12px 1fr auto;row-gap:8px}.lrow .dot{grid-row:1}.lrow>span:nth-child(2){grid-column:2;grid-row:1}.lrow b{grid-column:3;grid-row:1}.lbar{grid-column:2/4;grid-row:2}
}

.exp,.m-toggle{display:none}
.m-toggle[hidden]{display:none!important}
.banner .b-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.banner .btn{padding:8px 16px;min-height:40px}
.welcome{background:color-mix(in srgb,var(--blue) 10%,var(--card))}
.xt{display:none}
@media all{
  .scroll{overflow:visible}
  table,tbody,tfoot{display:block;width:100%}
  thead{display:none}
  tr{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;padding:14px;margin-top:10px;background:var(--card2);border-radius:18px}
  td,td.num,td.act{display:block;padding:0;border:0;min-width:0;width:auto;text-align:left}
  .mini{display:block;width:100%;margin:8px 0 5px}
  tbody tr:last-child td{border:0}
  td[data-label]::before{content:attr(data-label);display:block;font-size:12px;font-weight:600;color:var(--label2);margin-bottom:3px}
  td[data-m="t"]{grid-column:1/-1;order:1;padding-right:46px}
  td[data-m="t"]::before,td[data-m="s"]::before{display:none}
  td[data-m="s"]{grid-column:1/-1;order:2;margin-top:-4px}
  td[data-m="k"]{order:3}
  td[data-m="d"]{order:4;display:none}
  tr.open td[data-m="d"]{display:block}
  td.exp{display:block;position:absolute;top:10px;right:8px}
  td.act{display:none;grid-column:1/-1;order:5;border-top:.5px solid var(--sep);padding-top:8px}
  tr.open td.act{display:block}
  .chev{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:0;border-radius:50%;background:var(--fill);color:var(--label2);cursor:pointer}
  .chev svg{transition:transform .2s}
  tr.open .chev svg{transform:rotate(180deg)}
  .xi{display:none}.xt{display:inline;color:var(--red-t);font-weight:600;font-size:15px}
  .x{padding:8px 4px;border-radius:8px}
  td input,td select,td input[type=text],td input[type=date],td input[type=number]{min-width:0;width:100%;min-height:44px;font-size:16px;background:var(--card);border-radius:12px;padding:10px 12px;text-align:left}
  td[data-m="t"] input,td[data-m="t"] select{font-weight:600;font-size:17px}
  td input:hover,td select:hover{background:var(--card)}
  td input:focus,td select:focus{background:var(--card)}
  .calc,td .calc{padding:0;white-space:normal;color:var(--label);font-size:16px;font-weight:500;display:block}
  td .calc.ok,td .calc.bad,td .calc.warn{display:inline-block;padding:2px 10px;margin:0;font-size:13px;font-weight:600}
  td[data-m="k"] .calc{font-size:19px;font-weight:700}
  tfoot tr{background:none;border:1.5px dashed var(--sep);padding:12px 14px}
  tfoot td{order:0;display:none}
  tfoot td[data-label],tfoot td.tl{display:block}
  tfoot td.tl{grid-column:1/-1;font-size:13px;font-weight:600;color:var(--label2)}
  tfoot td .calc{font-size:17px;font-weight:700}
  .m-toggle{display:inline-flex;align-items:center;min-height:44px;margin:8px 0 0 -6px;padding:0 6px;font-weight:600;font-size:15px;color:var(--blue-t);background:none;border:0;border-radius:10px;cursor:pointer}
  .add{min-height:44px;margin-top:10px}
  .share input,.fx input{font-size:16px;min-height:40px}
  .sheet{margin-top:4px}
}

tbody{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;align-items:start}
tbody tr{margin-top:0}
tfoot{margin-top:12px}
tfoot tr{margin-top:0;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
td input,td select,td input[type=text],td input[type=date],td input[type=number]{font-size:15px;min-height:40px}
td[data-m="t"] input,td[data-m="t"] select{font-size:16px}
.calc,td .calc{font-size:15px}
td[data-m="k"] .calc{font-size:18px}
tfoot td .calc{font-size:16px}
@media (max-width:900px){
  tbody{grid-template-columns:1fr}
  tfoot tr{grid-template-columns:1fr 1fr}
  td input,td select,td input[type=text],td input[type=date],td input[type=number]{font-size:16px;min-height:44px}
  td[data-m="t"] input,td[data-m="t"] select{font-size:17px}
  .calc,td .calc{font-size:16px}
  td[data-m="k"] .calc{font-size:19px}
  tfoot td .calc{font-size:17px}
}

tfoot td:not([data-label]):not(.tl){display:none}
tfoot td,tfoot td.num,tfoot td.tl{border:0;padding:0}
@media (min-width:901px){
  tr.compact{grid-template-columns:minmax(0,1fr) 140px 40px;gap:10px 12px;padding:12px 12px 12px 14px}
  tr.compact td[data-m="t"]{grid-column:1;padding-right:0}
  tr.compact td[data-m="t"]::before{display:block}
  tr.compact td[data-m="k"]{grid-column:2}
  tr.compact td.exp{position:static;grid-column:3;grid-row:1;align-self:end;order:4}
  tr.compact td[data-m="d"],tr.compact td.act{grid-column:1/-1}
}

.tx-list-tile .tx-list{margin-top:4px}
.tx-group{margin-top:16px}
.tx-month{display:flex;justify-content:space-between;align-items:baseline;padding:0 6px 8px;font-size:13px;font-weight:600;color:var(--label2)}
.tx-card{background:var(--card2);border-radius:18px;overflow:hidden}
.tx-row{display:grid;grid-template-columns:40px minmax(0,1fr) auto 12px;gap:12px;align-items:center;width:100%;padding:12px 14px;border:0;border-top:.5px solid var(--sep);background:none;text-align:left;font:inherit;color:var(--label);cursor:pointer;transition:background .15s}
.tx-row:first-child{border-top:0}
.tx-row:hover{background:var(--fill)}
.tx-row:active{background:var(--fill2)}
.tx-ic{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--tc) 16%,transparent);color:var(--tc)}
.tx-main b,.tx-amt b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-main small,.tx-amt small{display:block;color:var(--label2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-amt{text-align:right;max-width:46vw}
.tx-amt b{font-weight:700;font-size:16px}
.tx-amt b.ok{color:var(--green-t)}
.tx-chev{color:var(--label3);font-size:22px;line-height:1}

.frow .mini{margin-right:8px}
@media (prefers-reduced-motion:reduce){.sheet-back,.sheet-panel{transition:none}}

  let sy = null;
  top.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; sy = e.clientY; try { top.setPointerCapture(e.pointerId); } catch (x) {} panel.style.transition = 'none'; });
  top.addEventListener('pointermove', e => { if (sy == null) return; panel.style.transform = `translate(-50%,${Math.max(0, e.clientY - sy)}px)`; });
  const end = e => { if (sy == null) return; const dy = Math.max(0, e.clientY - sy); sy = null; panel.style.transition = ''; panel.style.transform = ''; if (dy > 110) closeSheet(); };
  top.addEventListener('pointerup', end); top.addEventListener('pointercancel', end);
  back.append(panel); document.body.append(back); document.body.style.overflow = 'hidden';
  sheet = { back, onKey, row, coll, isBlank: cfg.isBlank, get isNew() { return flag.v; } };
  document.addEventListener('keydown', onKey);
  requestAnimationFrame(() => { back.classList.add('in'); (isNew ? $('.frow input', panel) : panel).focus(); });
}
const sRow = (label, ctrl) => h('label', { class: 'frow' }, h('span', { class: 'fl' }, label), ctrl);
const sCalc = (label, fn) => h('div', { class: 'frow' }, h('span', { class: 'fl' }, label), calcEl(fn));
const sCol = (label, key, type, extra) => Object.assign({ label, key, type }, extra);
function sheetMeter(k) {
  const [, name, c] = CATS.find(x => x[0] === k);
  const wrap = h('div', { class: 'sheet-sum', style: '--sc:var(--' + c + ')' }, h('div', { class: 'sum-t' }, 'Left to allocate in ' + name));
  const m = h('div', { class: 'meter', 'data-calc': '' }); m._u = () => { m.innerHTML = meterHtml(k); }; m._u(); wrap.append(m); return wrap;
}
function openTxSheet(row, isNew) {
  openFormSheet({ row, isNew, coll: 'transactions', title: 'Transaction', newTitle: 'New transaction', deleteLabel: 'Delete transaction', confirmText: 'Delete this transaction? This cannot be undone.',
    isBlank: r => !r.description && !hasAmount(r) && !r.related,
    groups: [
      [sRow('Description', field(sCol('Description', 'description', 'text', { ph: 'What was it for?' }), row)), sRow('Amount', field(sCol('Amount (account currency)', 'amount', 'number'), row)), sRow('Date', field(sCol('Date', 'date', 'date'), row))],
      [sRow('Type', field(sCol('Type', 'type', 'select', { opts: () => TYPES.map(([v, t]) => ({ v, t })) }), row)), sRow('Account', field(sCol('Account', 'account', 'select', { opts: accOpts }), row)),
        sRow('User', field(sCol('User', 'user', 'select', { opts: userOpts }), row)), sRow('Related item', field(sCol('Related item', 'related', 'text', { ph: 'Expense, debt or goal name' }), row))],
      [sCalc('Currency', () => (state.accounts.find(a => a.id === row.account) || {}).currency || 'NZD'), sCalc('Amount in NZD', () => hasAmount(row) ? money(txNZD(row)) : '\u2014')]] });
}

/* goals and debts as lists */
const ring = p => `<span class="li-ring"><svg viewBox="0 0 44 44" width="44" height="44" aria-hidden="true"><circle class="rg-bg" cx="22" cy="22" r="18"/><circle class="rg-fg" cx="22" cy="22" r="18" stroke-dasharray="${(p / 100 * 113.1).toFixed(1)} 113.1" transform="rotate(-90 22 22)"${p < 0.5 ? ' style="display:none"' : ''}/></svg><b>${Math.round(p)}%</b></span>`;
const progH = (saved, total) => { const p = total > 0 ? Math.min(saved / total, 1) * 100 : 0; return { html: `<span class="mini"><i style="width:${p}%"></i></span>${money(saved, 0)} (${p.toFixed(0)}%)` }; };
const dueDate = s => fmtDate(new Date(s + 'T00:00:00'));
function goalRowEl(g) {
  const r = D().goals[g.id], pct = r.hasTarget && num(g.target) > 0 ? Math.min(r.saved / num(g.target), 1) * 100 : 0;
  const b = h('button', { class: 'tx-row li', type: 'button', 'data-id': g.id, onclick: () => openGoalSheet(g, false) });
  b.innerHTML = `${ring(pct)}<span class="tx-main"><b>${esc(g.name || 'Untitled goal')}</b><small>${r.hasTarget ? 'Saved ' + money(r.saved, 0) + ' of ' + money(num(g.target), 0) : 'No target set'}${r.projected ? ', reached ' + fmtDate(r.projected) : ''}</small><span class="pill ${cls(r.status)}">${esc(r.status)}</span></span>
    <span class="tx-amt"><b>${money(num(g.monthly))}</b><small>a month</small></span><span class="tx-chev" aria-hidden="true">\u203a</span>`;
  return b;
}
function debtRowEl(d) {
  const r = D().debts[d.id], pct = r.bal > 0 ? Math.min(r.funded / r.bal, 1) * 100 : 0;
  const b = h('button', { class: 'tx-row li', type: 'button', 'data-id': d.id, onclick: () => openDebtSheet(d, false) });
  b.innerHTML = `${ring(pct)}<span class="tx-main"><b>${esc(d.name || 'Untitled debt')}</b><small>${money(r.bal, 0)} owed, ${r.unfunded < 0.005 ? 'fully covered' + (r.funded - r.bal > 0.5 ? ', ' + money(r.funded - r.bal, 0) + ' extra set aside' : '') : money(r.unfunded, 0) + ' still to find'}${d.due ? ', due ' + dueDate(d.due) : ''}</small><span class="pill ${cls(r.status)}">${esc(r.status)}</span></span>
    <span class="tx-amt"><b>${money(num(d.monthly))}</b><small>a month</small></span><span class="tx-chev" aria-hidden="true">\u203a</span>`;
  return b;
}
function rowList(rows, rowEl, emptyMsg) {
  const wrap = h('div', { class: 'li-wrap', 'data-calc': '' });
  wrap._u = () => {
    wrap.innerHTML = ''; const list = rows();
    if (!list.length) { wrap.append(h('p', { class: 'empty' }, emptyMsg)); return; }
    wrap.append(h('div', { class: 'tx-card' }, list.map(rowEl)));
  };
  wrap._u(); return wrap;
}
function totalsEl(fn) { const t = h('div', { class: 'li-total', 'data-calc': '' }); t._u = () => { t.innerHTML = fn().map(([l, v]) => `<div><small>${l}</small><b>${v}</b></div>`).join(''); }; t._u(); return t; }
const listBlock = (list, totals, label, onAdd) => h('div', {}, list, totals, h('button', { class: 'add', type: 'button', onclick: onAdd }, label));
function openGoalSheet(g, isNew) {
  const G = () => D().goals[g.id];
  openFormSheet({ row: g, isNew, coll: 'goals', title: 'Goal', newTitle: 'New goal', deleteLabel: 'Delete goal', confirmText: 'Delete this goal? Money set aside for it will be kept as "something else".',
    isBlank: r => !r.name && (r.target === '' || r.target == null) && (r.monthly === '' || r.monthly == null), summary: sheetMeter('savings'),
    groups: [
      [sRow('Goal', field(sCol('Goal', 'name', 'text', { ph: 'e.g. House deposit' }), g)), sRow('User', field(sCol('User', 'user', 'select', { opts: userOpts }), g)),
        sRow('Target (NZD)', field(sCol('Target (NZD)', 'target', 'number'), g)), sRow('Target date', field(sCol('Target date', 'date', 'date'), g)), sRow('Monthly (NZD)', field(sCol('Monthly (NZD)', 'monthly', 'number'), g))],
      [sCalc('Saved so far', () => G().hasTarget ? progH(G().saved, num(g.target)) : money(G().saved)), sCalc('Still to save', () => G().hasTarget ? money(G().remaining) : '\u2014'),
        sCalc('Reached by', () => G().projected ? fmtDate(G().projected) : '\u2014'), sCalc('Needed monthly', () => G().required == null ? '\u2014' : money(G().required)),
        sCalc('Status', () => ({ t: G().status, cls: cls(G().status) }))]] });
}
function openDebtSheet(d, isNew) {
  const Dd = () => D().debts[d.id];
  openFormSheet({ row: d, isNew, coll: 'debts', title: 'Debt', newTitle: 'New debt', deleteLabel: 'Delete debt', confirmText: 'Delete this debt? Money set aside for it will be kept as "something else".',
    isBlank: r => !r.name && (r.balance === '' || r.balance == null) && (r.monthly === '' || r.monthly == null), summary: sheetMeter('debt'),
    groups: [
      [sRow('Debt', field(sCol('Debt', 'name', 'text', { ph: 'e.g. Car loan' }), d)), sRow('Priority', field(sCol('Priority', 'priority', 'number'), d)),
        sRow('Borrower', field(sCol('Borrower', 'borrower', 'select', { opts: userOpts }), d)), sRow('Owed to', field(sCol('Owed to', 'creditor', 'text'), d)),
        sRow('Due date', field(sCol('Due date', 'due', 'date'), d)), sRow('Currency', field(sCol('Currency', 'currency', 'select', { opts: curOpts }), d)),
        sRow('Balance', field(sCol('Balance', 'balance', 'number'), d)), sRow('Monthly payment (NZD)', field(sCol('Monthly payment (NZD)', 'monthly', 'number'), d))],
      [sCalc('Balance (NZD)', () => money(Dd().bal)), sCalc('Covered so far', () => progH(Dd().funded, Dd().bal)), sCalc('Still to find', () => money(Dd().unfunded)),
        sCalc('Repaid by', () => Dd().projected ? fmtDate(Dd().projected) : '\u2014'), sCalc('Needed monthly', () => Dd().required == null ? '\u2014' : money(Dd().required)),
        sCalc('Status', () => ({ t: Dd().status, cls: cls(Dd().status) }))]] });
}

const txView = () => {
  const el = h('div', {}, head('Transactions', 'A record of money in and out. It is for tracking only and does not change balances or the budget. Tap a transaction to see and edit the details.'));
  const f = state.ui.txType || 'all';
  const tot = type => () => money(sum(state.transactions.filter(t => t.type === type), txNZD));
  const count = k => k === 'all' ? state.transactions.length : state.transactions.filter(t => t.type === k).length;
  const addTx = () => {
    const r = { id: uid(), date: new Date().toISOString().slice(0, 10), user: '', account: '', type: f !== 'all' ? f : 'expense', related: '', description: '', amount: '' };
    state.transactions.push(r); commit(); openTxSheet(r, true);
  };
  const side = tile(4, { class: 'tx-side' }, h('h2', {}, 'Show'),
    h('div', { class: 'fl-list', role: 'group', 'aria-label': 'Filter by type' }, [['all', 'All']].concat(TYPES).map(([k, l]) =>
      h('button', { class: 'fl-b', type: 'button', 'aria-pressed': String(f === k), onclick: () => { state.ui.txType = k; save(); render(); } }, h('span', {}, l), h('span', { class: 'n' }, String(count(k)))))),
    h('button', { class: 'btn full', type: 'button', onclick: addTx }, 'Add transaction'));
  el.append(bento(
    kpiTile('Income', tot('income'), 'money in'), kpiTile('Expenses', tot('expense'), 'everyday spending'),
    kpiTile('Debt payments', tot('debt'), 'paid towards debts'), kpiTile('Goal contributions', tot('goal'), 'put towards goals'),
    tile(8, { class: 'tx-list-tile' }, h('h2', {}, 'All transactions'), txList()), side));
  return el;
};

const dataView = () => {
  const el = h('div', {}, head('People and data', storageOK ? 'Everything you type is saved in this browser on this device. Nothing is sent anywhere.' : 'Saving is switched off in this view. Open the file directly in your browser to keep your changes.'));
  const exportJson = () => { const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }); const a = h('a', { href: URL.createObjectURL(blob), download: 'household-planner-data.json' }); document.body.append(a); a.click(); a.remove(); };
  el.append(bento(
    tableView({ title: 'People', note: 'Everyone who owns accounts, debts, goals or expenses. These names fill the User dropdowns.', compact: true, roles: { 'Name': 't', 'Type': 'k' }, coll: 'users', addLabel: 'Add person', span: 7, blank: () => ({ name: '', type: 'Individual' }),
      cols: [{ label: 'Name', key: 'name', type: 'text' }, { label: 'Type', key: 'type', type: 'select', opts: () => [{ v:'Individual', t:'Individual' }, { v:'Joint', t:'Joint' }] }] }),
    tile(5, {}, h('h2', {}, 'Appearance'), h('p', { class: 'sub' }, 'Auto follows your device. Light and Dark stay as you set them.'), h('div', { style: 'margin-top:16px' }, themeSeg())),
    tile(12, {}, h('h2', {}, 'Your data'), h('p', { class: 'sub' }, 'Export a copy to back up or move to another device. Importing replaces what is here now.'),
      h('div', { class: 'actions' },
        h('button', { class: 'btn', type: 'button', onclick: exportJson }, 'Export JSON'),
        h('button', { class: 'btn plain', type: 'button', onclick: startImport }, 'Import JSON'),
        h('button', { class: 'btn danger', type: 'button', onclick: () => { if (confirm('Delete all data on this device? Export a copy first if you want to keep it.')) { state = blank(); legacy = false; state.ui.tab = 'data'; dirty = true; save(); render(); } } }, 'Clear everything')))));
  return el;
};

/* ---------- import ---------- */
const importInput = h('input', { type: 'file', accept: 'application/json,.json', hidden: true, 'aria-label': 'Import JSON file' });
importInput.addEventListener('change', () => {
  const f = importInput.files[0]; if (!f) return; const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result); if (typeof d !== 'object' || d === null || !Array.isArray(d.accounts)) throw new Error('bad');
      if (hasData() && !confirm('Replace everything here with the contents of this file?')) return;
      state = normalize(d); legacy = false; state.ui.tab = 'dashboard'; dirty = true; save(); render(); window.scrollTo(0, 0);
    } catch (e) { alert('That file could not be read. Choose a JSON file exported from this page.'); }
  };
  r.readAsText(f); importInput.value = '';
});
document.body.append(importInput);
function startImport() { importInput.click(); }
function hasData() { return ['users','income','expenses','goals','debts','accounts','commitments','transactions'].some(k => state[k].length); }

/* ---------- shell ---------- */
const TABS = [['dashboard','Dashboard',dashView,'dashboard','Dashboard'],['plan','Plan',planView,'plan','Plan'],['accounts','Accounts',accountsView,'accounts','Accounts'],
  ['transactions','Transactions',txView,'transactions','Activity'],['data','People and data',dataView,'people','People']];
function renderNav() {
  const nav = $('#nav'); nav.innerHTML = '';
  nav.append(h('div', { class: 'brand' }, 'Household planner'));
  for (const [id, label,, ic, short] of TABS) {
    const b = h('button', { type: 'button', 'aria-current': state.ui.tab === id ? 'page' : false, onclick: () => { state.ui.tab = id; save(); render(); window.scrollTo(0, 0); } });
    b.innerHTML = icon(ic); b.append(h('span', { class: 'lbl-long' }, label), h('span', { class: 'lbl-short' }, short)); nav.append(b);
  }
  nav.append(h('div', { class: 'nav-foot' }, themeSeg(), h('span', {}, storageOK ? 'Saved on this device' : 'Not saving')));
}
function render() {
  dirty = true;
  const main = $('#main'); main.innerHTML = '';
  if (!storageOK) main.append(h('div', { class: 'banner', role: 'status' }, 'Saving is blocked here, so changes will be lost when you close this page. Download the file and open it in your browser to save.'));
  if (legacy) main.append(h('div', { class: 'banner legacy', role: 'status' },
    h('b', {}, 'Saved data found. '), 'This browser still has data saved by an earlier version of this page. Keep it, or clear it to start empty?',
    h('div', { class: 'b-actions' },
      h('button', { class: 'btn danger', type: 'button', onclick: () => { if (!confirm('Clear all saved data from this browser? Export a copy first if you want to keep it.')) return; state = blank(); legacy = false; dirty = true; save(); render(); } }, 'Clear it'),
      h('button', { class: 'btn plain', type: 'button', onclick: () => { legacy = false; save(); render(); } }, 'Keep it'))));
  const t = TABS.find(x => x[0] === state.ui.tab) || TABS[0];
  main.append(t[2]());
  renderNav();
}
render();
})();
</script>
